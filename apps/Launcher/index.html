<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Clean Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" class="stage">
  <div class="bg"></div>
  <div id="glow" class="glow"></div>

  <div class="clock">
    <div id="greeting" class="greeting"></div>
    <div id="time" class="time">--:--</div>
    <div id="date" class="date"></div>
  </div>

  <div id="utils" class="utils">
    <div id="util-plate" class="chip-plate"></div>
  </div>

  <div class="shelf">
    <div id="eyebrow-stack" class="eyebrow-stack">
      <div class="eyebrow" data-k="apps">APPS</div>
      <div class="eyebrow" data-k="controls">CONTROLS</div>
      <div class="eyebrow" data-k="quick">QUICK</div>
      <div class="eyebrow" data-k="edit">EDIT HOME</div>
      <div class="eyebrow" data-k="reorder">REORDER</div>
      <div class="eyebrow" data-k="music">NOW PLAYING</div>
    </div>
    <div id="title-stack" class="title-stack"></div>
    <div id="sub-stack" class="sub-stack">
      <p class="sub" data-k="apps">Press OK to open</p>
      <p class="sub" data-k="quick">Quick controls</p>
      <p class="sub" data-k="control">Press OK to open</p>
      <p class="sub" data-k="edit">OK adds or removes</p>
      <p class="sub" data-k="reorder">Left / Right to move · OK to lock</p>
      <p class="sub" data-k="music">OK for controls</p>
    </div>
  </div>

  <div id="np-card" class="np-card" hidden>
    <div class="np-art-wrap">
      <img id="np-art" class="np-art" alt="">
      <div id="np-note" class="np-note">♪</div>
    </div>
    <div class="np-body">
      <div id="np-title" class="np-title"></div>
      <div id="np-artist" class="np-artist"></div>
      <div class="np-bar"><div id="np-fill" class="np-fill"></div></div>
      <div class="np-hint">DOWN FOR CONTROLS</div>
    </div>
    <div id="np-state" class="np-state">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="#f3f5f8"><path d="M8 5l11 7-11 7z"/></svg>
    </div>
  </div>

  <div id="music" class="music" hidden>
    <div class="music-card">
      <div class="mu-top">
        <div class="mu-art-wrap">
          <img id="mu-art" class="mu-art" alt="">
          <div id="mu-note" class="mu-note">♪</div>
        </div>
        <div class="mu-meta">
          <div class="mu-kicker">NOW PLAYING · SPOTIFY</div>
          <div id="mu-title" class="mu-title"></div>
          <div id="mu-artist" class="mu-artist"></div>
          <div class="mu-bar"><div id="mu-fill" class="mu-fill"></div></div>
          <div class="mu-times"><span id="mu-pos">0:00</span><span id="mu-dur">0:00</span></div>
        </div>
      </div>
      <div class="mu-controls">
        <div class="mu-btn" data-i="0">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="#f3f5f8"><path d="M7 5h2v14H7zM19 5l-9 7 9 7z"/></svg>
        </div>
        <div class="mu-btn focus" data-i="1">
          <svg viewBox="0 0 24 24" width="38" height="38" fill="#f3f5f8"><path d="M8 5l11 7-11 7z"/></svg>
        </div>
        <div class="mu-btn" data-i="2">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="#f3f5f8"><path d="M17 5h-2v14h2zM5 5l9 7-9 7z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div id="dock" class="dock">
    <div id="dock-plate" class="plate"></div>
  </div>
  <div id="rail" class="rail">
    <div id="rail-plate" class="chip-plate"></div>
  </div>
  <div id="grid" class="grid" hidden>
    <div id="grid-plate" class="plate"></div>
  </div>

  <div id="empty" class="empty" hidden>
    <p id="empty-text">No apps found.</p>
    <p class="hint">Press OK to try again.</p>
  </div>

  <div id="toast" class="toast"></div>
</div>
<script src="main.js"></script>
</body>
</html>
