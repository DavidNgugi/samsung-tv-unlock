<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/installer/installer.css">

<body>
<div class="bg"></div>

      <span class="brand-icon"><img src="/appicon" alt=""></span>

    </div>
    <nav id="steps" class="steps"></nav>
